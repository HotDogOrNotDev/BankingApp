spring:
  profiles:
    active: dev
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 30m # TTL = 30 минут

jwt:
  secret: ${JWT_SECRET}

auth:
  refresh_token_life_seconds: 60
  access_token_life_seconds: 1

logging:
  level:
    com.aston: INFO