databaseChangeLog:
  - changeSet:
      id: 1
      author: Denis Siliukov
      preConditions:
        - not:
            tableExists:
              tableName: accounts
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: acc_number
                  type: varchar(20)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: money
                  type: numeric(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: blocked
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false