version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres-db-currency
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d currencydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: